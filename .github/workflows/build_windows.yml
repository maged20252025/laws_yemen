name: Build Flutter Windows
on: push: branches: [ "main", "master" ]
workflow_dispatch:
jobs: build: runs-on: windows-latest
steps: - name: Checkout Repository uses: actions/checkout@v4 - name: Set up Flutter uses: subosito/flutter-action@v2 with: flutter-version: '3.27.x' channel: stable cache: true - name: Enable Windows Desktop run: flutter config --enable-windows-desktop - name: Create Windows Platform run: flutter create . --platforms=windows --overwrite - name: Install Dependencies run: flutter pub get - name: Clean Build run: flutter clean - name: Build Windows Release run: flutter build windows --release - name: Upload Windows Release uses: actions/upload-artifact@v4 with: name: laws-yemen-windows path: build/windows/x64/runner/Release/
