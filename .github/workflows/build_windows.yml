name: Build Flutter Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows Platform
        run: flutter create . --platforms=windows

      - name: Install Dependencies
        run: flutter pub get

      - name: Clean Build
        run: flutter clean

      - name: Diagnose Windows Build Environment
        shell: pwsh
        run: |
          flutter doctor -v
          cmake --version
          Write-Host "CMAKE_GENERATOR=$env:CMAKE_GENERATOR"
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json

      - name: Build Windows Release
        run: flutter build windows --release --cmake-args="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: laws-yemen-windows
          path: build/windows/x64/runner/Release/
