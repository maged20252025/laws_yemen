name: laws_yemen
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1

  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

  # ✅ قواعد البيانات
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # ✅ حفظ الحالة
  shared_preferences: ^2.2.2



  # ✅ الصلاحيات
  permission_handler: ^12.0.1

  # ✅ أيقونات
  font_awesome_flutter: ^10.9.0

  # ✅ ميزات جديدة
  share_plus: ^7.2.2
  adaptive_theme: ^3.7.2

  # ✅ تنسيق التاريخ
  intl: ^0.20.2
  
  # 🟢 Firebase
  firebase_core: 3.10.0
  cloud_firestore: 5.6.1
  firebase_auth: 5.4.0
  firebase_messaging: 15.2.0
  
  flutter_highlight: ^0.7.0
  device_info_plus: ^9.1.2

  # ✅ مكتبة التمرير للفهرس
  scroll_to_index: ^3.0.1

  # ✅ مكتبة تصغير النص التلقائي
  auto_size_text: ^3.0.0

  # ✅ فحص الاتصال بالإنترنت
  connectivity_plus: ^6.1.5

  # ✅ Google APIs
  googleapis: ^12.0.0
  googleapis_auth: ^1.6.0

  # ✅ مكتبات HTTP
  http: ^1.1.0
  http_parser: ^4.0.2

  # 🟢 إشعارات
  flutter_local_notifications: ^17.2.4 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

  # ✅ توليد الأكواد
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.10.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/laws/
    - assets/regulations/
    - assets/prosecutions/
    - assets/judgments/
    - assets/alahkam/
    - assets/images/
    - assets/activation_codes.json
